<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Realtime Debug</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="mark">R</span><div><strong>Realtime Debug</strong><small>设备与阿里云会话</small></div></div>
    <div class="status"><span id="live-dot" class="dot"></span><span id="live-label">连接中</span><span id="session-count">0 个会话</span></div>
  </header>
  <main class="layout">
    <aside class="sessions">
      <div class="pane-head"><h1>会话</h1><button id="refresh" class="icon-button" title="刷新会话" aria-label="刷新会话">↻</button></div>
      <div id="session-list" class="session-list"><div class="empty">暂无采集记录</div></div>
    </aside>
    <section class="timeline-pane">
      <div class="pane-head"><div><h2 id="session-title">选择会话</h2><p id="session-subtitle">选择左侧会话查看事件</p></div><a id="export" class="export" hidden>导出会话</a></div>
      <div class="filters"><input id="search" type="search" placeholder="搜索事件、回复 ID 或详情" aria-label="搜索事件"><select id="kind" aria-label="事件类型"><option value="">所有事件</option><option value="ws_tx">发送消息</option><option value="ws_tx_result">发送结果</option><option value="ws_rx">接收消息</option><option value="pcm_uplink">上行 PCM</option><option value="pcm_playback">播放 PCM</option><option value="aec_mic">AEC 麦克风</option><option value="aec_ref">AEC 参考</option><option value="aec_out">AEC 输出</option><option value="local_event">本地事件</option><option value="trace_gap">记录缺口</option></select></div>
      <div id="audio-tracks" class="audio-tracks" hidden></div>
      <div id="event-list" class="event-list"><div class="empty">等待选择会话</div></div>
      <button id="load-more" class="load-more" hidden>加载更多事件</button>
    </section>
    <aside class="detail-pane"><div class="pane-head"><h2>事件详情</h2></div><div id="detail" class="detail"><div class="empty">选择时间线中的事件</div></div></aside>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
